name: Build HACS Init image

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

env:
  REGISTRY: docker.io
  IMAGE_NAME: laurentlemercier/homeassistant-hacs-init

jobs:

  check:

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:

      - name: Get latest HACS version
        id: version

        run: |

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/hacs/integration/releases/latest \
            | jq -r '.tag_name')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub

        id: check

        run: |

          STATUS=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${{ steps.version.outputs.version }})

          if [ "$STATUS" = "200" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:

    needs: check

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          build-args: |
            HACS_VERSION=${{ needs.check.outputs.version }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: mode=max

          sbom: true